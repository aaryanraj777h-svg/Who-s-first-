<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Who's First</title>
<style>
:root {
  --bg: #0f0d1e;
  --bg-elevated: #1a1635;
  --card: #221e42;
  --yellow: #ffd23f;
  --yellow-dark: #e6b800;
  --text: #f5f5f7;
  --muted: #9b9bb8;
  --danger: #ff5e5e;
  --success: #34d399;
  --border: rgba(255, 210, 63, 0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  background-image: radial-gradient(circle at 20% 80%, rgba(255, 210, 63, 0.05) 0%, transparent 50%),
                    radial-gradient(circle at 80% 20%, rgba(100, 80, 200, 0.08) 0%, transparent 50%);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
  overflow-x: hidden;
}
.container { max-width: 480px; margin: 0 auto; padding: 20px 16px; }

/* Animations */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes timerPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 210, 63, 0.4); }
  50% { box-shadow: 0 0 0 12px rgba(255, 210, 63, 0); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.fade-in { animation: fadeInUp 0.5s ease-out; }
.slide-in { animation: slideIn 0.4s ease-out; }

/* Login */
.login-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 20px;
}
.logo {
  font-size: 42px;
  font-weight: 800;
  text-align: center;
  background: linear-gradient(135deg, var(--yellow), #fff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
  letter-spacing: -1px;
}
.subtitle {
  text-align: center;
  color: var(--muted);
  margin-bottom: 32px;
  font-size: 15px;
}
.login-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  animation: fadeInUp 0.6s ease-out;
}
input, button {
  width: 100%;
  padding: 16px;
  margin: 10px 0;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  transition: all 0.2s ease;
}
input {
  background: rgba(42, 38, 80, 0.8);
  color: white;
  border: 1px solid transparent;
}
input:focus {
  outline: none;
  border-color: var(--yellow);
  box-shadow: 0 0 0 3px rgba(255, 210, 63, 0.15);
}
button {
  background: linear-gradient(135deg, var(--yellow), var(--yellow-dark));
  color: #171433;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 210, 63, 0.3);
}
button:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 210, 63, 0.4);
}
button:active { transform: translateY(0); }
button:disabled { opacity: 0.5; cursor: not-allowed; }

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px;
  margin: 16px 0;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  animation: fadeInUp 0.5s ease-out;
}
h2 {
  color: var(--yellow);
  font-size: 22px;
  margin-bottom: 16px;
  font-weight: 700;
}

/* Tabs */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(26, 22, 56, 0.95);
  backdrop-filter: blur(20px);
  display: flex;
  justify-content: space-around;
  padding: 6px 0 10px;
  border-top: 1px solid var(--border);
  z-index: 100;
}
.tab-bar button {
  background: none;
  color: var(--muted);
  width: auto;
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  box-shadow: none;
}
.tab-bar button.active {
  color: var(--yellow);
  background: rgba(255, 210, 63, 0.1);
}
.tab-icon { font-size: 20px; }

/* Quiz */
.timer {
  width: 100px;
  height: 100px;
  margin: 20px auto;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--yellow), #ffed4a);
  color: #171433;
  font-size: 36px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: timerPulse 1.5s infinite;
  box-shadow: 0 0 30px rgba(255, 210, 63, 0.4);
}
.question {
  font-size: 20px;
  font-weight: 600;
  margin: 20px 0;
  line-height: 1.5;
  animation: fadeInUp 0.4s ease-out;
}
.option-btn {
  background: rgba(42, 38, 80, 0.9) !important;
  color: white !important;
  text-align: left !important;
  border: 1px solid transparent !important;
  margin: 8px 0 !important;
  transition: all 0.2s !important;
  box-shadow: none !important;
}
.option-btn:hover {
  border-color: var(--yellow) !important;
  background: rgba(255, 210, 63, 0.1) !important;
  transform: translateX(4px);
}
.msg {
  padding: 12px 14px;
  margin: 6px 0;
  background: rgba(42, 38, 80, 0.6);
  border-radius: 12px;
  border-left: 3px solid var(--yellow);
  animation: slideIn 0.3s ease-out;
}
.leaderboard-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  background: rgba(42, 38, 80, 0.6);
  margin: 8px 0;
  border-radius: 12px;
  animation: slideIn 0.4s ease-out;
}
.rank { font-weight: 800; color: var(--yellow); width: 30px; }
.error { color: var(--danger); text-align: center; margin: 10px 0; font-size: 14px; }
.success { color: var(--success); }
.hidden { display: none !important; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
  <div id="loginScreen" class="login-screen">
    <div class="logo">Who's First</div>
    <p class="subtitle">Player Login</p>
    <div class="login-box">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button onclick="login()">Login</button>
      <div id="loginError" class="error"></div>
      <div id="debugInfo" style="font-size:12px; color:#888; margin-top:10px; text-align:center;"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <div id="quizTab" class="fade-in">
      <h2>Quiz</h2>
      <div id="quizContent">Loading quiz...</div>
    </div>
    <div id="boardTab" class="hidden">
      <h2>Leaderboard</h2>
      <div id="leaderboard"></div>
    </div>
    <div id="chatTab" class="hidden">
      <h2>Group Chat</h2>
      <div id="chatMessages" style="height:55vh; overflow-y:auto; margin-bottom:12px; padding-right:4px;"></div>
      <input id="chatInput" placeholder="Message likho...">
      <button onclick="sendChat()">Send</button>
    </div>
    <div id="historyTab" class="hidden">
      <h2>History</h2>
      <div id="history"></div>
    </div>
    <div id="settingsTab" class="hidden">
      <h2>Settings</h2>
      <div class="card">
        <p style="margin-bottom:16px;">Logged in as: <strong id="currentUser" style="color:var(--yellow)"></strong></p>
        <input id="newPassword" type="password" placeholder="New Password">
        <button onclick="changePassword()">Change Password</button>
        <button onclick="logout()" style="background:linear-gradient(135deg,#ff5e5e,#e53e3e); margin-top:16px;">Logout</button>
      </div>
    </div>
  </div>
</div>

<div class="tab-bar hidden" id="tabBar">
  <button class="active" onclick="showTab('quiz')"><span class="tab-icon">📝</span>Quiz</button>
  <button onclick="showTab('board')"><span class="tab-icon">🏆</span>Board</button>
  <button onclick="showTab('chat')"><span class="tab-icon">💬</span>Chat</button>
  <button onclick="showTab('history')"><span class="tab-icon">📜</span>History</button>
  <button onclick="showTab('settings')"><span class="tab-icon">⚙️</span>Settings</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBf1P8CAnOO82mZ732Y__Qc5GhZPtbmuoU",
  authDomain: "who-s-first-413b6.firebaseapp.com",
  projectId: "who-s-first-413b6",
  storageBucket: "who-s-first-413b6.firebasestorage.app",
  messagingSenderId: "127926503365",
  appId: "1:127926503365:web:46a1f4a9eb1ecc3b602dac"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUsername = '';
let quizId = null;
let questions = [];
let currentQ = 0;
let answers = [];
let timerInterval = null;
let serverOffset = 0;

const PLAYER_ACCOUNTS = [
  { user: 'AYANT41', pass: '2X4C5Z', email: 'u_ayant41@whosfirst.app' },
  { user: 'AZLAN2Z1', pass: '18A4C5', email: 'u_azlan2z1@whosfirst.app' },
  { user: 'AARYAN7X4', pass: '88G77F', email: 'u_aaryan7x4@whosfirst.app' },
  { user: 'AYUSH9X0', pass: '1F2JK4', email: 'u_ayush9x0@whosfirst.app' },
  { user: 'PRATYUSH1J0', pass: 'CH24TC', email: 'u_pratyush1j0@whosfirst.app' }
];

function showError(msg) {
  const el = document.getElementById('loginError');
  if (el) el.textContent = msg;
  console.error('[Login]', msg);
}

function showDebug(msg) {
  const el = document.getElementById('debugInfo');
  if (el) el.textContent = msg;
}

// Warn if opened as local file
if (window.location.protocol === 'file:') {
  showDebug('⚠️ Direct HTML file se Firebase login nahi hota. Local server ya Vercel use karo.');
}

async function login() {
  const password = document.getElementById('password').value.trim();
  if (!password) return showError('Password daalo');
  
  showError('Checking...');
  showDebug('Login shuru...');

  if (typeof firebase === 'undefined') {
    return showError('Firebase library load nahi hui. Internet on hai?');
  }

  let lastError = '';
  let matched = false;

  for (const acc of PLAYER_ACCOUNTS) {
    if (acc.pass.toLowerCase() === password.toLowerCase()) {
      matched = true;
      try {
        showDebug('Trying: ' + acc.email);
        await auth.signInWithEmailAndPassword(acc.email, acc.pass);
        showError('');
        showDebug('Login successful!');
        return;
      } catch (e) {
        lastError = (e.code || e.message || 'error').toString();
        console.error(e);
        showDebug('Firebase error: ' + lastError);
      }
    }
  }

  if (!matched) {
    showError('Galat password');
    showDebug('');
  } else {
    showError('Login failed → ' + lastError);
  }
}

auth.onAuthStateChanged(async user => {
  if (user) {
    currentUsername = user.email.split('@')[0].replace('u_', '').toUpperCase();
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('tabBar').classList.remove('hidden');
    document.getElementById('currentUser').textContent = currentUsername;
    initApp();
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('tabBar').classList.add('hidden');
  }
});

function logout() { auth.signOut(); }

async function changePassword() {
  const newPass = document.getElementById('newPassword').value;
  if (newPass.length < 6) return alert('Password 6+ characters hona chahiye');
  try {
    await auth.currentUser.updatePassword(newPass);
    alert('Password change ho gaya');
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

function showTab(tab) {
  ['quiz','board','chat','history','settings'].forEach(t => {
    document.getElementById(t + 'Tab').classList.add('hidden');
  });
  const el = document.getElementById(tab + 'Tab');
  el.classList.remove('hidden');
  el.classList.add('fade-in');
  document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

async function initApp() {
  try {
    const pingRef = db.collection('ping').doc(currentUsername.toLowerCase());
    await pingRef.set({ t: firebase.firestore.FieldValue.serverTimestamp() });
    const snap = await pingRef.get();
    if (snap.exists && snap.data().t) {
      serverOffset = snap.data().t.toDate().getTime() - Date.now();
    }
  } catch(e) {}

  db.collection('quiz').doc('cur').onSnapshot(snap => {
    if (snap.exists) {
      const data = snap.data();
      quizId = data.id;
      loadQuiz(data);
    } else {
      document.getElementById('quizContent').innerHTML = '<p style="text-align:center;color:var(--muted);padding:40px 0;">Koi active quiz nahi hai.</p>';
    }
  });

  db.collection('chat').orderBy('t', 'desc').limit(50).onSnapshot(snap => {
    const msgs = [];
    snap.forEach(d => msgs.push(d.data()));
    msgs.reverse();
    const el = document.getElementById('chatMessages');
    el.innerHTML = msgs.map(m => `<div class="msg"><strong>${m.u}</strong>: ${m.m}</div>`).join('');
    el.scrollTop = el.scrollHeight;
  });

  loadScores();
}

async function loadScores() {
  try {
    const snap = await db.collection('scores').where('u', '==', currentUsername).get();
    const hist = [];
    snap.forEach(d => hist.push(d.data()));
    hist.sort((a,b) => (b.t?.toMillis?.() || 0) - (a.t?.toMillis?.() || 0));
    document.getElementById('history').innerHTML = hist.map(h => 
      `<div class="leaderboard-item"><span>${h.title || 'Quiz'}</span><span style="color:var(--yellow);font-weight:700;">${h.s}/${h.n}</span></div>`
    ).join('') || '<p style="text-align:center;color:var(--muted);">Koi history nahi</p>';

    const all = await db.collection('scores').where('id', '==', quizId || 'none').get();
    const board = [];
    all.forEach(d => board.push(d.data()));
    board.sort((a,b) => b.s - a.s);
    document.getElementById('leaderboard').innerHTML = board.map((b,i) => 
      `<div class="leaderboard-item"><span class="rank">${i+1}</span><span>${b.u}</span><span style="color:var(--yellow);font-weight:700;">${b.s}/${b.n}</span></div>`
    ).join('') || '<p style="text-align:center;color:var(--muted);padding:20px;">Abhi scores publish nahi hue</p>';
  } catch(e) { console.error(e); }
}

async function loadQuiz(quiz) {
  const now = Date.now() + serverOffset;
  const start = quiz.startAt ? quiz.startAt.toDate().getTime() : 0;
  const el = document.getElementById('quizContent');

  if (now < start) {
    const update = () => {
      const left = Math.max(0, Math.floor((start - (Date.now() + serverOffset)) / 1000));
      el.innerHTML = `<div class="timer">${left}</div><p style="text-align:center;color:var(--muted);margin-top:12px;">Quiz shuru hone wala hai...</p>`;
      if (left <= 0) loadQuiz(quiz);
    };
    update();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(update, 1000);
    return;
  }

  try {
    const qsSnap = await db.collection('qs').doc(quizId).get();
    if (!qsSnap.exists) {
      el.innerHTML = '<p style="text-align:center;color:var(--muted);">Questions abhi available nahi hain.</p>';
      return;
    }
    questions = qsSnap.data().items || [];
    currentQ = 0;
    answers = new Array(questions.length).fill(-1);
    showQuestion();
  } catch(e) {
    el.innerHTML = '<p class="error">Questions load nahi ho paye</p>';
  }
}

function showQuestion() {
  if (currentQ >= questions.length) {
    finishQuiz();
    return;
  }
  const q = questions[currentQ];
  const el = document.getElementById('quizContent');
  el.innerHTML = `
    <div class="timer" id="qTimer">20</div>
    <div class="question">${currentQ+1}. ${q.q}</div>
    <div id="opts"></div>
  `;
  const opts = document.getElementById('opts');
  q.o.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    opts.appendChild(btn);
  });

  let time = 20;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    time--;
    const tEl = document.getElementById('qTimer');
    if (tEl) tEl.textContent = time;
    if (time <= 0) {
      clearInterval(timerInterval);
      currentQ++;
      showQuestion();
    }
  }, 1000);
}

function selectAnswer(i) {
  answers[currentQ] = i;
  clearInterval(timerInterval);
  currentQ++;
  showQuestion();
}

async function finishQuiz() {
  document.getElementById('quizContent').innerHTML = '<p class="success" style="text-align:center;font-size:18px;padding:40px 0;">Quiz complete! Answers save ho rahe hain...</p>';
  try {
    await db.collection('ans').doc(quizId + '_' + currentUsername.toLowerCase()).set({
      u: currentUsername,
      q: quizId,
      a: answers,
      t: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('quizContent').innerHTML = '<p class="success" style="text-align:center;font-size:18px;padding:40px 0;">Answers save ho gaye!<br>Admin scores publish karega.</p>';
  } catch(e) {
    document.getElementById('quizContent').innerHTML = '<p class="error">Save failed</p>';
  }
}

async function sendChat() {
  const msg = document.getElementById('chatInput').value.trim();
  if (!msg) return;
  try {
    await db.collection('chat').add({
      u: currentUsername,
      m: msg,
      t: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('chatInput').value = '';
  } catch(e) {
    alert('Chat error');
  }
}
</script>
</body>
</html>
