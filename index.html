<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google-site-verification" content="Lja79bbUkvN_JF3FjYW73FsouI38SmjSH6aSXfg_tzc" />
<title>Who's First</title>
<style>
:root {
  --bg: #0c0a18;
  --surface: #16132b;
  --card: #1e1a38;
  --yellow: #ffd23f;
  --yellow-soft: rgba(255, 210, 63, 0.15);
  --text: #f4f4f6;
  --muted: #8b8ba8;
  --success: #4ade80;
  --border: rgba(255,255,255,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 72px;
}
.container { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes confetti {
  0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  animation: fadeUp 0.4s ease;
}
h1 {
  text-align: center;
  font-size: 32px;
  font-weight: 700;
  background: linear-gradient(135deg, #fff, var(--yellow));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.subtitle { text-align: center; color: var(--muted); margin-bottom: 24px; }
h2 { font-size: 20px; font-weight: 600; margin-bottom: 12px; }
input, button {
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 15px;
  margin: 6px 0;
}
button {
  background: var(--yellow);
  color: #111;
  font-weight: 600;
  border: none;
  cursor: pointer;
}
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(12, 10, 24, 0.95);
  backdrop-filter: blur(12px);
  display: flex;
  border-top: 1px solid var(--border);
  padding: 6px 0 10px;
}
.tab-bar button {
  background: none;
  color: var(--muted);
  width: auto;
  flex: 1;
  padding: 8px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 10px;
  margin: 0 4px;
}
.tab-bar button.active { color: var(--yellow); background: var(--yellow-soft); }
.timer {
  width: 90px; height: 90px; margin: 16px auto;
  border-radius: 50%;
  background: var(--yellow);
  color: #111;
  font-size: 32px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 30px var(--yellow-soft);
}
.question { font-size: 18px; font-weight: 600; margin: 16px 0; line-height: 1.45; }
.option-btn {
  background: var(--surface) !important;
  color: var(--text) !important;
  text-align: left !important;
  margin: 8px 0 !important;
  border: 1px solid transparent !important;
}
.option-btn:hover { border-color: var(--yellow) !important; }
.leaderboard-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px; background: var(--surface);
  border-radius: 12px; margin: 8px 0;
}
.rank { font-weight: 700; color: var(--yellow); width: 28px; }
.hidden { display: none !important; }
.celebration {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 200; text-align: center; padding: 20px;
}
.confetti-piece {
  position: absolute; width: 10px; height: 10px;
  background: var(--yellow); animation: confetti 3s linear infinite;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
  <div id="loginScreen">
    <h1>Who's First</h1>
    <p class="subtitle">Player Login</p>
    <div class="card">
      <input id="password" type="password" placeholder="Password">
      <button onclick="login()">Login</button>
      <div id="loginError" class="error" style="color:#ff6b6b; text-align:center; margin-top:8px;"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <div id="quizTab">
      <h2>Quiz</h2>
      <div id="quizContent">Waiting for quiz...</div>
    </div>
    <div id="boardTab" class="hidden">
      <h2>Leaderboard</h2>
      <div id="leaderboard"></div>
    </div>
    <div id="historyTab" class="hidden">
      <h2>History</h2>
      <div id="history"></div>
    </div>
    <div id="settingsTab" class="hidden">
      <h2>Settings</h2>
      <div class="card">
        <p>Logged in as <strong id="currentUser"></strong></p>
        <button onclick="logout()" style="background:#ff6b6b; margin-top:16px;">Logout</button>
      </div>
    </div>
  </div>
</div>

<div class="tab-bar hidden" id="tabBar">
  <button class="active" onclick="showTab('quiz')">Quiz</button>
  <button onclick="showTab('board')">Board</button>
  <button onclick="showTab('history')">History</button>
  <button onclick="showTab('settings')">Settings</button>
</div>

<div id="celebration" class="celebration hidden">
  <div id="confetti"></div>
  <h1 style="font-size:42px; margin-bottom:8px;">Winner!</h1>
  <p id="winnerName" style="font-size:24px; color:var(--yellow); margin-bottom:16px;"></p>
  <p>Sab milkar celebrate karo</p>
  <button onclick="document.getElementById('celebration').classList.add('hidden')" style="margin-top:24px; max-width:200px;">Close</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBf1P8CAnOO82mZ732Y__Qc5GhZPtbmuoU",
  authDomain: "who-s-first-413b6.firebaseapp.com",
  projectId: "who-s-first-413b6",
  storageBucket: "who-s-first-413b6.firebasestorage.app",
  messagingSenderId: "127926503365",
  appId: "1:127926503365:web:46a1f4a9eb1ecc3b602dac"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const PLAYER_ACCOUNTS = [
  { pass: '2X4C5Z', email: 'u_ayant41@whosfirst.app', user: 'AYANT41' },
  { pass: '18A4C5', email: 'u_azlan2z1@whosfirst.app', user: 'AZLAN2Z1' },
  { pass: '88G77F', email: 'u_aaryan7x4@whosfirst.app', user: 'AARYAN7X4' },
  { pass: '1F2JK4', email: 'u_ayush9x0@whosfirst.app', user: 'AYUSH9X0' },
  { pass: 'CH24TC', email: 'u_pratyush1j0@whosfirst.app', user: 'PRATYUSH1J0' }
];

let currentUsername = '';
let quizId = null;
let questions = [];
let currentQ = 0;
let answers = [];
let timerInterval = null;

async function login() {
  const password = document.getElementById('password').value.trim();
  if (!password) return document.getElementById('loginError').textContent = 'Password daalo';
  document.getElementById('loginError').textContent = 'Checking...';
  for (const acc of PLAYER_ACCOUNTS) {
    if (acc.pass.toLowerCase() === password.toLowerCase()) {
      try {
        await auth.signInWithEmailAndPassword(acc.email, acc.pass);
        return;
      } catch (e) {
        document.getElementById('loginError').textContent = e.code || e.message;
      }
    }
  }
  document.getElementById('loginError').textContent = 'Galat password';
}

auth.onAuthStateChanged(user => {
  if (user) {
    const found = PLAYER_ACCOUNTS.find(a => a.email === user.email);
    currentUsername = found ? found.user : user.email.split('@')[0].replace('u_', '').toUpperCase();
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('tabBar').classList.remove('hidden');
    document.getElementById('currentUser').textContent = currentUsername;
    initApp();
  }
});

function logout() { auth.signOut(); location.reload(); }

function showTab(tab) {
  ['quiz','board','history','settings'].forEach(t => document.getElementById(t + 'Tab').classList.add('hidden'));
  document.getElementById(tab + 'Tab').classList.remove('hidden');
  document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function initApp() {
  db.collection('quiz').doc('cur').onSnapshot(snap => {
    if (snap.exists) {
      const data = snap.data();
      quizId = data.id;
      console.log('Quiz received:', quizId);
      loadQuiz(data);
      // Start listening to scores for this quiz
      listenScores();
    } else {
      document.getElementById('quizContent').innerHTML = '<p style="text-align:center;color:var(--muted);padding:40px 0;">No active quiz</p>';
    }
  }, err => {
    console.error('Quiz listen error:', err);
    document.getElementById('quizContent').innerHTML = '<p style="color:#ff6b6b;text-align:center;">Error: ' + (err.code || err.message) + '</p>';
  });
  
  // History listener (all scores of this user)
  db.collection('scores').where('u', '==', currentUsername).onSnapshot(snap => {
    const h = [];
    snap.forEach(d => h.push(d.data()));
    h.sort((a,b) => (b.t?.toMillis?.() || 0) - (a.t?.toMillis?.() || 0));
    document.getElementById('history').innerHTML = h.map(x => 
      `<div class="leaderboard-item"><span>${x.title || 'Quiz'}</span><span>${x.s}/${x.n}</span></div>`
    ).join('') || '<p style="text-align:center;color:var(--muted);">No history</p>';
  }, err => console.error('History error', err));
}

function listenScores() {
  if (!quizId) return;
  db.collection('scores').where('id', '==', quizId).onSnapshot(snap => {
    const board = [];
    snap.forEach(d => board.push(d.data()));
    board.sort((a,b) => b.s - a.s);
    document.getElementById('leaderboard').innerHTML = board.map((b,i) => 
      `<div class="leaderboard-item"><span class="rank">${i+1}</span><span>${b.u}</span><span>${b.s}/${b.n}</span></div>`
    ).join('') || '<p style="text-align:center;color:var(--muted);">Scores not published yet</p>';

    if (board.length && board[0].s >= 0) {
      showCelebration(board[0].u);
    }
  }, err => console.error('Leaderboard error', err));
}

function showCelebration(name) {
  document.getElementById('winnerName').textContent = name;
  const c = document.getElementById('confetti');
  c.innerHTML = '';
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 2 + 's';
    p.style.background = ['#ffd23f','#fff','#4ade80','#ff6b6b'][i % 4];
    c.appendChild(p);
  }
  document.getElementById('celebration').classList.remove('hidden');
}

async function loadQuiz(quiz) {
  const start = quiz.startAt ? quiz.startAt.toDate().getTime() : 0;
  const el = document.getElementById('quizContent');
  const now = Date.now();
  if (now < start) {
    const tick = () => {
      const left = Math.max(0, Math.floor((start - Date.now()) / 1000));
      el.innerHTML = `<div class="timer">${left}</div><p style="text-align:center;color:var(--muted);">Starting soon</p>`;
      if (left <= 0) loadQuiz(quiz);
    };
    tick();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(tick, 1000);
    return;
  }
  try {
    const qs = await db.collection('qs').doc(quizId).get();
    if (!qs.exists) { el.innerHTML = '<p>Questions not ready</p>'; return; }
    questions = qs.data().items || [];
    currentQ = 0;
    answers = new Array(questions.length).fill(-1);
    showQuestion();
  } catch (e) {
    el.innerHTML = '<p>Error loading questions</p>';
  }
}

function showQuestion() {
  if (currentQ >= questions.length) { finishQuiz(); return; }
  const q = questions[currentQ];
  const el = document.getElementById('quizContent');
  el.innerHTML = `<div class="timer" id="qTimer">20</div><div class="question">${currentQ+1}. ${q.q}</div><div id="opts"></div>`;
  const opts = document.getElementById('opts');
  q.o.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    opts.appendChild(btn);
  });
  let t = 20;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    t--;
    const te = document.getElementById('qTimer');
    if (te) te.textContent = t;
    if (t <= 0) { clearInterval(timerInterval); currentQ++; showQuestion(); }
  }, 1000);
}

function selectAnswer(i) {
  answers[currentQ] = i;
  clearInterval(timerInterval);
  currentQ++;
  showQuestion();
}

async function finishQuiz() {
  document.getElementById('quizContent').innerHTML = '<p style="text-align:center;padding:40px 0;">Quiz complete. Saving answers...</p>';
  try {
    await db.collection('ans').doc(quizId + '_' + currentUsername.toLowerCase()).set({
      u: currentUsername, q: quizId, a: answers, t: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('quizContent').innerHTML = '<p style="text-align:center;padding:40px 0;color:var(--success);">Answers saved.<br>Waiting for admin to publish scores...</p>';
    // Start checking for scores
    listenScores();
  } catch (e) {
    document.getElementById('quizContent').innerHTML = '<p style="text-align:center;color:#ff6b6b;">Save failed: ' + (e.message || '') + '</p>';
  }
}
</script>
</body>
</html>
