<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who's first</title>
<style>
:root{--bg:#171433;--card:#241f4d;--ac:#ffd23f;--tx:#f5f3ff;--mu:#a49fd0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Trebuchet MS",Verdana,sans-serif}
#v{padding:18px 16px 90px;max-width:560px;margin:auto}h1,h2{font-weight:900;letter-spacing:-.5px;margin:.3em 0}h1{font-size:2.4rem;color:var(--ac)}
.box{max-width:340px;margin:18vh auto;padding:0 20px;text-align:center}
input,button{font:inherit;width:100%;padding:13px;margin:6px 0;border-radius:10px;border:2px solid #3a3470;background:var(--card);color:var(--tx)}
button{background:var(--ac);color:#171433;font-weight:800;border:0;cursor:pointer}
.opt{background:var(--card);color:var(--tx);border:2px solid #3a3470;text-align:left;font-weight:600}.opt.sel{border-color:var(--ac);background:#3a3470}
.big{font-size:3rem;font-weight:900;color:var(--ac);text-align:center}.err{color:#ff8a8a}.mu{color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid #3a3470}
nav b{flex:1;text-align:center;padding:16px 0;font-size:.85rem;cursor:pointer;color:var(--mu)}nav b.on{color:var(--ac);box-shadow:inset 0 3px var(--ac)}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #3a3470}.me{color:var(--ac)}
.msg{padding:6px 0}.msg i{color:var(--ac);font-style:normal;font-weight:800}
</style></head><body><div id="app"><div class="box"><h1>Who's first</h1><input placeholder="Username"><input type="password" placeholder="Password"><button>Log in</button><p id="st" class="err"></p></div></div><script>setTimeout(function(){var s=document.getElementById('st');if(s&&!window.__ok&&!s.textContent)s.textContent='App could not start. Open it from your https Vercel link in Chrome (not a file preview) and check internet.'},6000)</script>
<script>
(async()=>{
const G="https://www.gstatic.com/firebasejs/10.12.2/",st=t=>{const s=document.getElementById('st');if(s)s.textContent=t};
let F;try{F=await Promise.all(["firebase-app","firebase-auth","firebase-firestore"].map(n=>import(G+n+".js")))}catch(e){st('Could not load Firebase ('+(e.message||e)+'). Open this page from your https Vercel link in Chrome and check internet.');throw e}
const{initializeApp}=F[0],{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,updatePassword,reauthenticateWithCredential,EmailAuthProvider}=F[1],{initializeFirestore,doc,getDoc,setDoc,addDoc,collection,query,orderBy,limit,where,onSnapshot,getDocs,serverTimestamp}=F[2];
const CFG={apiKey:"AIzaSyBf1P8CAnOO82mZ732Y__Qc5GhZPtbmuoU",authDomain:"who-s-first-413b6.firebaseapp.com",projectId:"who-s-first-413b6",appId:"1:127926503365:web:46a1f4a9eb1ecc3b602dac"};
const ap=initializeApp(CFG),au=getAuth(ap),db=initializeFirestore(ap,{experimentalAutoDetectLongPolling:true});
const $=s=>document.querySelector(s),A=$('#app'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=u=>u.slice(2).toUpperCase(),fmt=ms=>{let s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return(h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
window.__ok=1;const msg=e=>({'auth/operation-not-allowed':'Email/Password login is OFF. Turn it on in Firebase Authentication.','auth/invalid-credential':'Wrong username or password.','auth/wrong-password':'Wrong username or password.','auth/user-not-found':'This account does not exist yet. Create it in Firebase Authentication.','auth/invalid-email':'Invalid username.','auth/network-request-failed':'No internet connection.','auth/too-many-requests':'Too many tries. Wait a few minutes.','permission-denied':'Access denied. You may be blocked, or firestore.rules is not published in Firebase.','failed-precondition':'Firestore database is not created yet.','unavailable':'Cannot reach the database. Check internet.'})[e&&e.code]||'Error: '+(e&&(e.code||e.message));let me,off=0,un=[],tm;
function login(msg=''){A.innerHTML=`<div class=box><h1>Who's first</h1><input id=u placeholder="Username" autocapitalize=none><input id=p type=password placeholder="Password"><button id=go>Log in</button><p class=err>${msg}</p></div>`;
$('#go').onclick=async()=>{try{await signInWithEmailAndPassword(au,'u_'+$('#u').value.trim().toLowerCase()+'@whosfirst.app',$('#p').value)}catch(e){login(msg(e))}}}
onAuthStateChanged(au,async u=>{un.forEach(f=>f());un=[];clearInterval(tm);if(!u)return login();
me=u.email.split('@')[0];if(!me.startsWith('u_')){await signOut(au);return login('This is the player app. Admins use admin.html.')}
try{const r=doc(db,'users',me),s=await getDoc(r);
if(!s.exists())await setDoc(r,{name:nm(me),status:'active'});else{const d=s.data();if(d.status=='removed'||(d.status=='blocked'&&d.until>Date.now()))throw 0}
await setDoc(doc(db,'ping',me),{t:serverTimestamp()});off=(await getDoc(doc(db,'ping',me))).data().t.toMillis()-Date.now()}
catch(e){await signOut(au);return login(e===0?'Your access is blocked. Ask the admin.':msg(e))}
shell()});
function shell(){A.innerHTML=`<div id=v></div><nav>${[['quiz','Quiz'],['board','Board'],['chat','Chat'],['hist','History'],['set','Settings']].map(t=>`<b data-t=${t[0]}>${t[1]}</b>`).join('')}</nav>`;
document.querySelectorAll('nav b').forEach(b=>b.onclick=()=>go(b.dataset.t));go('quiz')}
function go(t){un.forEach(f=>f());un=[];clearInterval(tm);document.querySelectorAll('nav b').forEach(b=>b.className=b.dataset.t==t?'on':'');({quiz:vQuiz,board:vBoard,chat:vChat,hist:vHist,set:vSet})[t]()}
function vQuiz(){const v=$('#v');v.innerHTML='';
un.push(onSnapshot(doc(db,'quiz','cur'),s=>{clearInterval(tm);v.dataset.i='';
if(!s.exists())return v.innerHTML='<h2>No quiz yet</h2><p class=mu>The admin will schedule one.</p>';
const q=s.data();let items,ans=[],done=0;
tm=setInterval(async()=>{const t=Date.now()+off-q.startAt,i=Math.floor(t/20000);
if(t<0)return v.innerHTML=`<h2>${esc(q.title)}</h2><p class=mu>Quiz starts in</p><div class=big>${fmt(-t)}</div>`;
if(i<q.n){if(!items){try{items=(await getDoc(doc(db,'qs',q.id))).data().items}catch(e){return}}
if(v.dataset.i!=i){v.dataset.i=i;v.innerHTML=`<p class=mu>Question ${i+1} of ${q.n}</p><h2>${esc(items[i].q)}</h2>${items[i].o.map((o,k)=>`<button class=opt data-k=${k}>${esc(o)}</button>`).join('')}<div class=big id=c></div>`;
v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;v.querySelectorAll('.opt').forEach(x=>x.className='opt');b.className='opt sel'})}
$('#c').textContent=20-Math.floor((t-i*20000)/1000)+'s'}
else if(!done){done=1;clearInterval(tm);v.innerHTML='<h2>Quiz over</h2><p class=mu>Saving your answers...</p>';
try{await setDoc(doc(db,'ans',q.id+'_'+me),{u:me,q:q.id,a:Array.from({length:q.n},(_,j)=>ans[j]??-1)})}catch(e){}
un.push(onSnapshot(doc(db,'scores',q.id+'_'+me),r=>{v.innerHTML=r.exists()?`<h2>Your score</h2><div class=big>${r.data().s}/${r.data().n}</div>`:'<h2>Quiz over</h2><p class=mu>Your answers are in. Result comes when the admin publishes it.</p>'}))}
},500)},e=>v.innerHTML='<p class=err>'+msg(e)+'</p>'))}
async function vBoard(){const v=$('#v');v.innerHTML='<h2>Leaderboard</h2><p class=mu>Total points across all quizzes</p><div id=l></div>';
const t={};(await getDocs(collection(db,'scores'))).forEach(d=>{const x=d.data();t[x.u]=(t[x.u]||0)+x.s});
const r=Object.entries(t).sort((a,b)=>b[1]-a[1]);$('#l').innerHTML=r.length?r.map((e,i)=>`<div class="row ${e[0]==me?'me':''}"><span>${i+1}. ${esc(nm(e[0]))}</span><b>${e[1]}</b></div>`).join(''):'<p class=mu>No results yet.</p>'}
function vChat(){const v=$('#v');v.innerHTML='<h2>Friends chat</h2><div id=m></div><input id=t placeholder="Message"><button id=s>Send</button>';
un.push(onSnapshot(query(collection(db,'chat'),orderBy('t','desc'),limit(50)),s=>{$('#m').innerHTML=s.docs.map(d=>d.data()).reverse().map(x=>`<div class=msg><i>${esc(nm(x.u))}</i> ${esc(x.m)}</div>`).join('')},e=>$('#m').innerHTML='<p class=err>'+msg(e)+'</p>'));
$('#s').onclick=async()=>{const m=$('#t').value.trim();if(!m)return;$('#t').value='';await addDoc(collection(db,'chat'),{u:me,m:m.slice(0,500),t:serverTimestamp()})}}
async function vHist(){const v=$('#v');v.innerHTML='<h2>Test history</h2><div id=l></div>';
const r=(await getDocs(query(collection(db,'scores'),where('u','==',me)))).docs.map(d=>d.data()).sort((a,b)=>b.t-a.t);
$('#l').innerHTML=r.length?r.map(x=>`<div class=row><span>${esc(x.title||'Quiz')}<br><small class=mu>${new Date(x.t).toLocaleDateString()}</small></span><b>${x.s}/${x.n}</b></div>`).join(''):'<p class=mu>You have not taken a quiz yet.</p>'}
function vSet(){const v=$('#v');v.innerHTML=`<h2>Settings</h2><p class=mu>Logged in as ${esc(nm(me))}</p><h3>Change password</h3><input id=o type=password placeholder="Current password"><input id=n type=password placeholder="New password (min 6)"><button id=c>Change password</button><p id=r></p><button id=x class=opt>Log out</button>`;
$('#x').onclick=()=>signOut(au);
$('#c').onclick=async()=>{try{await reauthenticateWithCredential(au.currentUser,EmailAuthProvider.credential(au.currentUser.email,$('#o').value));await updatePassword(au.currentUser,$('#n').value);$('#r').textContent='Password changed.'}catch(e){$('#r').innerHTML='<span class=err>Could not change it. Check your current password and use 6+ characters.</span>'}}}

})().catch(function(e){var s=document.getElementById('st');if(s&&!s.textContent)s.textContent='Error: '+(e&&e.message||e)});
</script></body></html>
